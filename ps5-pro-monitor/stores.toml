# ---------------------------------------------------------------------------------------
# Butikker og produktsider som overvåkes.
#
#   products   = produktsider som sjekkes hvert `interval_seconds` (se config.toml)
#   listings   = kategorisider som skannes for NYE PS5 Pro-sider (nye varenummer/pakker)
#   extractor  = butikkspesifikk leser av innebygd lagerdata (elkjop | kjell | netonnet)
#   sku_regex  = plukker varenummeret ut av URL-stien (brukes til å forankre dataene)
#   aliases    = butikkens navn hos Prisjakt, hvis det avviker fra `name`
#   [store.markers] = regex som slår til på HTML-en rundt lagerstatusen (ekstra kilde)
#
# Vil du legge til egne sider uten å endre denne filen: lag `stores.local.toml` med samme
# format. Butikker med samme `id` slås sammen. Test en ny side med:
#     python -m ps5monitor check <URL>
# ---------------------------------------------------------------------------------------

[[store]]
id = "elkjop"
name = "Elkjøp"
extractor = "elkjop"
sku_regex = '/(\d+)/?$'
products = [
  "https://www.elkjop.no/product/gaming/spillkonsoller-og-tilbehor/playstation/ps5-playstation-5-spillkonsoll/playstation-5-pro-2tb-spillkonsoll/994805",
  "https://www.elkjop.no/product/gaming/spillkonsoller-og-tilbehor/playstation/ps5-playstation-5-spillkonsoll/playstation-5-pro-2tb/830990",
]
listings = [
  "https://www.elkjop.no/gaming/spillkonsoller-og-tilbehor/playstation/ps5-playstation-5-spillkonsoll",
]

[[store]]
id = "komplett"
name = "Komplett"
sku_regex = '/product/(\d+)'
products = [
  "https://www.komplett.no/product/1346176/gaming/konsoller/playstation/playstation-5-pro-2tb",
]
listings = [
  "https://www.komplett.no/category/12769/gaming/konsoller/playstation",
]
[store.markers]
# Komplett viser lager med web-komponenten <komplett-stock-icon color="..."> og speiler det
# i innebygd JSON ("stockIcon":"InStock"/"OutOfStock"). En fangstgruppe (...) blir detaljtekst.
in_stock = [
  '<komplett-stock-icon color="green"[^>]*title="Tilgjengelighet:\s*([^"]+)"',
  '"stockIcon"\s*:\s*"InStock"',
]
out_of_stock = [
  '"stockIcon"\s*:\s*"OutOfStock"',
  '<komplett-stock-icon color="red"',
  'stockstatus-stock-details">\s*Ikke p(?:å|&#xE5;) lager',
]

