# ---------------------------------------------------------------------------------------
# Prisjakt brukes som ekstra kilde. Tilbudslisten der dekker butikker som ikke kan leses
# direkte (Obs, HomeIT, Coolshop, CDON m.fl.) og fanger opp nye butikker automatisk.
# Tilbud fra butikker som allerede overvåkes direkte varsles ikke dobbelt.
# ---------------------------------------------------------------------------------------
[[aggregator]]
id = "prisjakt"
name = "Prisjakt"
type = "prisjakt"
link_regex = '^/product\.php\?p=\d+$'
products = [
  "https://www.prisjakt.no/product.php?p=13395263",
]
listings = [
  "https://www.prisjakt.no/s/ps5-pro/",
]
